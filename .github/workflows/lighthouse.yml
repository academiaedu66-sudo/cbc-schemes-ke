name: Lighthouse CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Lighthouse
        run: npx lighthouse https://www.cbcmaterials.shop --only-categories=performance,seo --output=json --output-path=./lighthouse-report.json
      - name: Upload report artifact
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-report
          path: ./lighthouse-report.json
